name: Milestone due reminder

# Reusable across every VITERAZ repository. Callers own the schedule — what time
# of day suits a team is theirs to pick — while this file owns the query and the
# message, so a fix lands everywhere at once.
#
# Why milestones and not issues: GitHub issues have no due date. Deadlines here
# live on the weekly sprint milestone ("Tuần 2 - 31/08/2026 - 06/09/2026"), so a
# milestone falling due is what "these issues are nearly out of time" means, and
# every open issue still on it is what is at risk.
#
# One message per run, one embed per milestone, never one per issue: a sprint
# carries five to ten issues and a reminder that fires ten times is a reminder
# nobody reads twice.
#
# Permissions are deliberately not declared here: a called workflow can never
# hold more than its caller granted, so the caller is the single place that says
# `issues: read`. Declaring it in both spots only invites them to drift apart.

on:
  workflow_call:
    inputs:
      lead_days:
        # How much warning to give: a milestone is reported once a day from
        # this many days out until it is closed. 1 means the reminder starts the
        # day before it is due, then repeats on the day itself and every day it
        # stays overdue.
        type: number
        default: 1
        required: false
        description: Days of notice before a milestone's due date.
      mention:
        # Same knob as pr-notify.yml, and the same reasoning: "@everyone",
        # "@here", "<@&ROLE_ID>", or "" to post the embed without a ping.
        type: string
        default: "@everyone"
        required: false
        description: Mention prepended to the reminder when something is due or overdue.
      max_issues:
        # Discord truncates embed descriptions at 4096 characters. Cutting the
        # list explicitly keeps the message readable and says how many were
        # left out, rather than letting Discord reject the payload.
        type: number
        default: 15
        required: false
        description: Most issues to list per milestone before summarising the rest.
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
        description: Discord webhook URL for the channel that should receive reminders.

jobs:
  remind:
    name: Report milestones that are due or overdue
    runs-on: ubuntu-latest
    steps:
      - name: Find due milestones and post them
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MENTION: ${{ inputs.mention }}
          LEAD_DAYS: ${{ inputs.lead_days }}
          MAX_ISSUES: ${{ inputs.max_issues }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping."
            exit 0
          fi

          # 100 milestones is far more than a repo has open at once; paginating
          # would only add a failure mode for a case that does not occur.
          gh api "repos/${REPO}/milestones?state=open&per_page=100" > milestones.json

          # Day arithmetic against midnight UTC rather than the moment the job
          # happens to start, so a run at 02:00 and a rerun at 23:00 agree on
          # what "tomorrow" means. Only the date half of due_on is trusted:
          # GitHub has returned both midnight and mid-morning for it.
          jq -c --argjson lead "${LEAD_DAYS}" '
            (((now / 86400) | floor) * 86400) as $today
            | [ .[]
                | select(.due_on != null)
                | { number, title, html_url,
                    due: .due_on[0:10],
                    days: (((((.due_on[0:10] + "T00:00:00Z") | fromdateiso8601) - $today) / 86400) | floor) }
                | select(.days <= $lead) ]
          ' milestones.json > due.json

          COUNT="$(jq 'length' due.json)"
          if [ "${COUNT}" -eq 0 ]; then
            echo "No milestone is due in ${LEAD_DAYS} day(s) or overdue; nothing to post."
            exit 0
          fi
          echo "Reporting ${COUNT} milestone(s)."

          echo '[]' > embeds.json
          jq -c '.[]' due.json | while read -r MILESTONE; do
            NUMBER="$(printf '%s' "${MILESTONE}" | jq -r '.number')"

            # The issues endpoint returns pull requests too; they are not work
            # items on the board and would inflate every count.
            gh api "repos/${REPO}/issues?state=open&milestone=${NUMBER}&per_page=100" \
              | jq '[.[] | select(.pull_request == null)
                     | { number, title, html_url, assignees: [.assignees[].login] }]' > issues.json

            # jq assembles the embed so issue titles — arbitrary user text, in
            # any language — cannot break the JSON.
            jq -n \
              --argjson ms "${MILESTONE}" \
              --slurpfile issues issues.json \
              --argjson max "${MAX_ISSUES}" \
              --arg repo "${REPO}" '
              ($issues[0]) as $list
              | ($list | length) as $total
              | ($list[:$max]
                 | map("[#\(.number)](\(.html_url)) \(.title)"
                       + (if (.assignees | length) > 0
                          then " — " + (.assignees | map("`" + . + "`") | join(", "))
                          else " — _unassigned_" end))
                 | join("\n")) as $lines
              | {
                  title: (if   $ms.days <  0 then "🔴 Milestone overdue: \($ms.title)"
                          elif $ms.days == 0 then "🟠 Milestone due today: \($ms.title)"
                          elif $ms.days == 1 then "⏰ Milestone due tomorrow: \($ms.title)"
                          else "⏰ Milestone due in \($ms.days) days: \($ms.title)" end),
                  url: $ms.html_url,
                  color: (if   $ms.days <  0 then 15158332   # red
                          elif $ms.days == 0 then 16744192   # orange
                          else 16097024 end),                # amber
                  description: (if $total == 0
                                then "_No open issues left on this milestone._"
                                else $lines + (if $total > $max
                                               then "\n… and \($total - $max) more"
                                               else "" end) end),
                  fields: [
                    { name: "Due",  value: $ms.due, inline: true },
                    { name: "Open", value: "\($total) issue(s)", inline: true },
                    { name: "Status",
                      value: (if   $ms.days <  0 then "\(-$ms.days) day(s) late"
                              elif $ms.days == 0 then "due today"
                              else "\($ms.days) day(s) left" end),
                      inline: true }
                  ],
                  footer: { text: $repo }
                }' > embed.json

            jq -s '.[0] + [.[1]]' embeds.json embed.json > embeds.next
            mv embeds.next embeds.json
          done

          # The mention is the only thing that goes in `content`. Discord parses
          # mentions there but not inside an embed, so every piece of issue and
          # milestone text stays on the embed side and a milestone named
          # "@everyone" cannot ping the server on its own. allowed_mentions then
          # caps what content is permitted to resolve.
          if [ -n "${MENTION}" ]; then
            CONTENT="${MENTION} — ${COUNT} milestone(s) due or overdue in \`${REPO}\`"
            case "${MENTION}" in
              *@everyone*|*@here*) PARSE='["everyone"]' ;;
              *"<@&"*)             PARSE='["roles"]'    ;;
              *)                   PARSE='[]'           ;;
            esac
          else
            CONTENT=""
            PARSE='[]'
          fi

          # Discord accepts at most 10 embeds per message. More open sprints
          # than that is not a notification problem.
          jq -n \
            --slurpfile embeds embeds.json \
            --arg content "${CONTENT}" \
            --argjson parse "${PARSE}" '
            {
              username: "VITERAZ PR Bot",
              content: $content,
              allowed_mentions: { parse: $parse },
              embeds: ($embeds[0][0:10])
            }' > payload.json

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 2 \
            -H "Content-Type: application/json" \
            -X POST -d @payload.json \
            "${WEBHOOK_URL}"
