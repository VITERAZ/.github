name: Close linked issues

# Reusable across every VITERAZ repository. Callers own the trigger; this file
# owns the logic, so a fix to the parsing lands everywhere at once.
#
# Why it exists: GitHub's own "Closes #12" keyword only fires for pull requests
# merged into the *default* branch. Work that lands on develop, staging or any
# other long-lived branch leaves its issue open, and the project board card sits
# in "In progress" long after the work shipped.
#
# Closing the issue is all this needs to do. The project's built-in "Item closed"
# workflow reacts to the closed state and moves Status to Done on its own, so no
# project scope and no PAT are involved.
#
# Permissions are deliberately not declared here: a called workflow can never
# hold more than its caller granted, so the caller is the single place that says
# `issues: write`. Declaring it in both spots only invites them to drift apart.

on:
  workflow_call:

jobs:
  close:
    name: Close issues referenced by the merged PR
    # A closed-but-not-merged PR must not close anything: abandoning a PR is not
    # the same as finishing the work.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const defaultBranch = context.payload.repository.default_branch

            // On the default branch GitHub already did this, and doing it twice
            // would post a duplicate comment on every issue.
            if (pr.base.ref === defaultBranch) {
              core.info(`Merged into the default branch (${defaultBranch}); GitHub handles this.`)
              return
            }

            // Only the PR description is scanned, matching what GitHub itself
            // does for the default branch. Titles are left out on purpose: a
            // title like "fix #2 spacing" is a reference, not a promise to close.
            const body = pr.body || ''
            const KEYWORDS = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi

            const numbers = [...new Set(
              [...body.matchAll(KEYWORDS)].map((m) => Number(m[1]))
            )]

            if (numbers.length === 0) {
              core.info('No closing keyword in the PR description; nothing to do.')
              return
            }

            core.info(`Referenced: ${numbers.map((n) => '#' + n).join(', ')}`)

            for (const issue_number of numbers) {
              let issue
              try {
                const res = await github.rest.issues.get({ ...context.repo, issue_number })
                issue = res.data
              } catch (error) {
                // A typo'd number must not fail the run — the merge already
                // happened, and a red X here would be noise, not a signal.
                core.warning(`#${issue_number}: cannot read (${error.status}). Skipped.`)
                continue
              }

              // `#12` addresses issues and pull requests from the same counter.
              if (issue.pull_request) {
                core.warning(`#${issue_number} is a pull request, not an issue. Skipped.`)
                continue
              }

              if (issue.state === 'closed') {
                core.info(`#${issue_number} is already closed. Skipped.`)
                continue
              }

              // The comment lands before the close so the issue's timeline reads
              // in the order things happened, and so anyone reading the closed
              // issue can see which PR did it — this path leaves no native
              // "linked pull request" entry the way the default branch would.
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Đã đóng tự động: ${pr.html_url} đã merge vào \`${pr.base.ref}\`.`,
              })

              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              })

              core.info(`#${issue_number} closed.`)
            }
