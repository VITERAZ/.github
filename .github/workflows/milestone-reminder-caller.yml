name: Milestone due reminder

# Thin caller. The logic lives in VITERAZ/.github so a fix reaches every repo at
# once; this file only says when to run it and what it may touch. Copy it into
# any repo that tracks deadlines on sprint milestones.
#
# Three things about `schedule:` that are easy to get wrong:
#
#   * It only ever runs from the repository's DEFAULT branch. A copy of this
#     file merged into develop is dormant until it reaches main.
#   * Cron is UTC, with no timezone field. 0 2 * * * is 09:00 in Asia/Ho_Chi_Minh.
#   * GitHub runs scheduled jobs on a best-effort queue: five to thirty minutes
#     late is normal, and a run can be dropped entirely under load. Fine for a
#     daily nudge, useless for anything that must happen at a precise time.
#
# GitHub also disables scheduled workflows in a repository with 60 days of no
# activity, and mails an admin when it does.
#
# workflow_dispatch is here so the reminder can be fired by hand from the
# Actions tab — the only practical way to test a change without waiting a day.
#
# Needs a DISCORD_WEBHOOK_URL repository secret. Organisation secrets do not
# reach private repositories on the free plan, so set it per repo:
#
#   gh secret set DISCORD_WEBHOOK_URL --repo VITERAZ/<repo>

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  remind:
    uses: VITERAZ/.github/.github/workflows/milestone-reminder.yml@main
    secrets: inherit
    # All optional; the defaults are one day of notice and an @everyone ping.
    #
    #   with:
    #     lead_days: 2                # start reminding two days out
    #     mention: "@here"            # or "<@&ROLE_ID>", or "" for no ping
    #     max_issues: 10              # listed per milestone before "… and N more"
